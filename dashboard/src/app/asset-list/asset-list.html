<div class="container container--responsive">
  <ep-asset-item-list
    [assets]="assetListItems"
    [columnsToDisplay]="columnsToDisplay"
    [showPriorityPlayTag]="true"
    [showAddTag]="true"
    [showBulkEditButton]="true"
    [showBulkCopyButton]="true"
    [loading]="(loading$ | async) ?? false"
    [page]="(pagination$ | async)?.CurrentPage ?? 1"
    [limit]="(pagination$ | async)?.Limit ?? 25"
    [totalPages]="(pagination$ | async)?.TotalPages ?? 1"
    [totalItems]="(pagination$ | async)?.TotalItems ?? 0"
    [externalTags]="(tags$ | async) ?? []"
    [selectedSpecialTags]="(selectedSpecialTags$ | async) ?? []"
    [enableNewPagination]="enableNewPagination"
    (paginationChange)="onPaginationChange($event)"
    (searchExternalTags)="onSearchExternalTags($event)"
    (clearFilters)="onClearFilters()"
    (edit)="onEditAsset($event)"
    (preview)="onPreviewAsset($event)"
    (deploy)="onDeployAsset($event)"
    (duplicate)="onDuplicateAsset($event)"
    (remove)="onRemoveAsset($event)"
    (nameEdit)="onNameEdit($event)"
    (saveReorder)="onSaveReorder($event)"
    (moveAssets)="onMoveAssets($event)"
    (removeSelectedAssets)="onRemoveSelectedAssets($event)"
    (hasUnsavedChanges)="onHasUnsavedChanges($event)"
    (bulkEdit)="onBulkEdit($event)"
    (bulkCopy)="onBulkCopy($event)"
  >
  </ep-asset-item-list>
</div>
